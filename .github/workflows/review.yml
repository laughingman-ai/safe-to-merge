name: review

# The fresh-context review, as a required check. The check run is created by GitHub
# Actions, and the rules on main accept `review/fresh-context` only from GitHub Actions, so a
# personal or agent token can't forge it.
#
# Only PRs into main are reviewed: main always has the reviewer, so its instructions,
# schema, and KNOWN_BUGS.md come from the base checkout (trusted/). The PR head (pr/) is
# checked out as files and not executed. Claude Code reads a read-only copy of them with
# .claude/, .mcp.json, CLAUDE.md, and .git removed, starts in an empty directory, and loads
# no project settings (--setting-sources user), so nothing in the PR can configure it: no
# env block, no apiKeyHelper, no hooks, no MCP servers. ANTHROPIC_BASE_URL is pinned below
# as well. A PR into another branch gets no review job and no API key.
#
# The pull_request_target run takes its definition from main, not from the PR. PRs from
# forks fail the check without running anything, because pull_request_target would give
# them the key; the owner re-pushes a fork's branch to this repo instead.
#
# MOVING TO pull_request_target. This step only adds the trigger, so the next PR, which
# removes `pull_request` and moves the API key into the `reviewer` environment, is checked
# by main's workflow instead of its own. Until then both triggers run, and `pull_request`
# still reads the workflow from the PR, as it did before this change.

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # comment the findings

concurrency:
  group: review-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review/fresh-context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A skipped job would count as passing, so a fork's PR fails here instead.
      - name: Only branches in this repository
        if: github.event_name != 'push' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PRs from forks aren't checked here. The owner re-pushes the branch to this repository."
          exit 1
      - name: Check out the base branch (the reviewer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the PR head (the code under review, read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.anthropic.com
        run: |
          if [ ! -f trusted/scripts/ci-review.sh ]; then
            echo "::error::No reviewer on the base branch: scripts/ci-review.sh is missing."
            exit 1
          fi
          bash trusted/scripts/ci-review.sh
