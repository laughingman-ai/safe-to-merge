name: review

# The fresh-context review, as a required check. The check run is created by GitHub
# Actions, and the rules on main accept `review/fresh-context` only from GitHub Actions, so a
# personal or agent token can't forge it.
#
# Only PRs into main are reviewed: main always has the reviewer, so its instructions,
# schema, and KNOWN_BUGS.md come from the base checkout (trusted/). The PR head (pr/) is
# checked out as files and not executed (except the hash-pinned bootstrap below). Claude Code reads a read-only copy of them with
# .claude/, .mcp.json, CLAUDE.md, and .git removed, starts in an empty directory, and loads
# no project settings (--setting-sources user), so nothing in the PR can configure it: no
# env block, no apiKeyHelper, no hooks, no MCP servers. ANTHROPIC_BASE_URL is pinned below
# as well. A PR into another branch gets no review job and no API key.
#
# This workflow file itself comes from the PR, which is why .github/ is a gate: agents
# can't edit it (hooks), the agent's GitHub App has no Workflows permission, and changes
# need the code owner's review.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # comment the findings

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review/fresh-context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the base branch (the reviewer)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the PR head (the code under review, read only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.290
      # BOOTSTRAP, PR #2 ONLY. Delete this step, and the `if` on the next one, in the first
      # commit after PR #2 merges (see docs/AGENT_IDENTITY.md, "After PR #2 merges").
      # main had no reviewer before #2, so #2 is reviewed with its own reviewer files, and
      # only if they are byte-for-byte the files pinned here.
      - name: Bootstrap review (PR #2 only, pinned files)
        if: ${{ github.event.pull_request.number == 2 && hashFiles('trusted/scripts/run-reviewer.sh') == '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.anthropic.com
          TRUSTED_DIR: ${{ github.workspace }}/pr
          REVIEW_NOTE: "_Bootstrap review: main had no reviewer yet, so this PR's reviewer files ran, after matching the pinned hashes in review.yml._"
        run: |
          cd pr
          sha256sum -c - <<'PINNED'
          6adc9257090e9b06f04f8028919b8fe157b01f23dbe9e5ec01688be5cdf78130  scripts/ci-review.sh
          7844bd7737d27a048a8fab5eb917f23483eb1e1d9f049f8b2a4775ed2c3417ee  scripts/run-reviewer.sh
          91aa6f35f094edcaf8ad934f80d7faee915203dd8eb3295759b23b1ab2c08406  scripts/review-prompt.md
          da6b4a444a4b4539f0345f3e4aa6e66930269cc4bd33c0f15c9557688ec70c4d  scripts/review-schema.json
          d376ccb5f52d3618c6351afc960460bdeee6d9f85c23ec80c200d2d666502535  KNOWN_BUGS.md
          PINNED
          cd ..
          bash pr/scripts/ci-review.sh
      - name: Review
        if: ${{ hashFiles('trusted/scripts/run-reviewer.sh') != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.anthropic.com
        run: bash trusted/scripts/ci-review.sh
      - name: No reviewer on the base branch
        if: ${{ github.event.pull_request.number != 2 && hashFiles('trusted/scripts/run-reviewer.sh') == '' }}
        run: |
          echo "::error::The base branch has no reviewer, so this PR can't be reviewed."
          exit 1
